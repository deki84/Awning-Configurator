# Name, der auf GitHub im Reiter "Actions" angezeigt wird
name: CI

# Wann läuft die Pipeline?
on:
  push:
    branches: [main] # bei jedem Push auf main
  pull_request: # und bei jedem Pull Request

jobs:
  test:
    # GitHub stellt einen frischen Linux-Rechner bereit
    runs-on: ubuntu-latest

    steps:
      # 1. Code aus dem Repo holen
      - uses: actions/checkout@v4

      # 2. pnpm installieren, dieselbe Hauptversion wie bei dir lokal
      - uses: pnpm/action-setup@v4

      # 3. Node.js installieren und den pnpm-Cache aktivieren,
      #    damit spätere Läufe schneller sind
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 4. Abhängigkeiten installieren, genau nach pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # 5. Alle Tests in allen Paketen über Turborepo ausführen
      - run: pnpm turbo run test

  images:
    # Erst bauen, wenn alle Tests grün sind
    needs: test
    # Nur bei Push auf main, nicht bei Pull Requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # GITHUB_TOKEN darf Images in die Registry schreiben
    permissions:
      contents: read
      packages: write

    # Matrix: derselbe Ablauf für beide Services, parallel
    strategy:
      matrix:
        service: [product-service, order-service]

    steps:
      - uses: actions/checkout@v4

      # Bei der GitHub Container Registry anmelden (kein eigenes Passwort nötig)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image bauen und pushen: einmal mit Commit-Hash, einmal als "latest"
      - uses: docker/build-push-action@v6
        with:
          context: . # Repo-Root, damit shared und Lockfile erreichbar sind
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/deki84/awning-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/deki84/awning-${{ matrix.service }}:latest
