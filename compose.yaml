# Lokale Entwicklungsumgebung.
# PostgreSQL läuft immer hier. Die Services laufen entweder ebenfalls hier
# (docker compose up) oder direkt auf dem Mac über `pnpm dev` für schnelleres Neuladen.
services:
  postgres:
    # Alpine: kleineres Image, schnellerer Download lokal und in der CI
    image: postgres:17-alpine
    container_name: awning-postgres
    environment:
      POSTGRES_USER: awning
      POSTGRES_PASSWORD: awning
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      # Benanntes Volume, damit die Daten `docker compose down` überleben
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Andere Container (und später Kubernetes-Probes) warten damit,
      # bis die Datenbank wirklich Verbindungen annimmt, nicht nur bis sie gestartet ist
      test: ["CMD-SHELL", "pg_isready -U awning -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    build:
      # Hauptordner als Build-Kontext, damit shared-Paket und Lockdatei erreichbar sind
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      # Host ist "postgres" (der Servicename), nicht localhost:
      # Im Container ist localhost der Container selbst
      DATABASE_URL: postgres://awning:awning@postgres:5432/orders
      PORT: 4002
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        # Erst starten, wenn die Datenbank wirklich Verbindungen annimmt
        condition: service_healthy

  product-service:
    build:
      # Hauptordner als Build-Kontext, damit shared-Paket und Lockdatei erreichbar sind
      context: .
      dockerfile: services/product-service/Dockerfile
    environment:
      PORT: 4001
    ports:
      - "4001:4001"

volumes:
  pgdata:
